{% extends "base.html" %}
{% block content %}
<div class="login-shell">
  <section class="login-panel">
    <div class="login-kicker">Portal escolar</div>
    <h2 class="mb-2">Ingresar</h2>
    <p class="text-muted mb-4">Escribí tu correo y tu contraseña.</p>
    <form method="post">
      <div class="mb-3">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" class="form-control form-control-lg" autocomplete="username" autocapitalize="none" autofocus required>
      </div>
      <div class="mb-4">
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input type="password" id="password" name="password" class="form-control form-control-lg" autocomplete="current-password" required>
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostrar contraseña"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100">Ingresar</button>
    </form>
    <p class="mt-3 text-muted">Admin: admin@colegio.com / admin123</p>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('togglePassword').addEventListener('click', function () {
  const input = document.getElementById('password');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  this.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
  this.querySelector('i').className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
});
</script>
{% endblock %}
