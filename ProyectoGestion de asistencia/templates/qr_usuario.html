{% extends "base.html" %}
{% block content %}
<h2>QR de {{ usuario.nombre }} {{ usuario.apellido }}</h2>
<div class="mt-4">
  <img src="data:image/png;base64,{{ qr_image }}" alt="Código QR" class="img-fluid" style="max-width: 300px;">
  <p class="small text-muted mt-2">Token: {{ token }}</p>
</div>
<p class="mt-3 text-muted">Escanéalo desde el panel de preceptor para validarlo.</p>
<div class="d-flex flex-wrap gap-2 mt-3">
  <a href="{{ url_for('descargar_qr_usuario', id=usuario.id, formato='jpg') }}" class="btn btn-primary"><i class="fa-solid fa-file-image"></i> Descargar JPG</a>
  <a href="{{ url_for('descargar_qr_usuario', id=usuario.id, formato='pdf') }}" class="btn btn-outline-primary"><i class="fa-solid fa-file-pdf"></i> Descargar PDF</a>
</div>
<a href="{{ url_for('gestion_usuarios') }}" class="btn btn-secondary mt-3">Volver</a>
{% endblock %}
